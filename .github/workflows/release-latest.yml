name: Release latest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    name: Publish latest prerelease
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Assemble FOSS debug APK
        run: ./gradlew :app:assembleFossDebug

      - name: Prepare APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/foss/debug -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" sdmaid-se-foss-debug.apk
          echo "path=sdmaid-se-foss-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mutable rolling tag: drop the previous release+tag, then recreate on this commit.
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --repo "${{ github.repository }}" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Latest debug build" \
            --notes "Unlocked FOSS debug APK from \`${{ github.sha }}\` on \`${{ github.ref_name }}\` (run ${{ github.run_number }})." \
            "${{ steps.apk.outputs.path }}"
